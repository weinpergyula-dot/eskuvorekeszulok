      <rect x="79" y="90" width="4" height="4" rx="2" fill="#002340"/>
      <text x="62" y="146" font-family="Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">Yettel</text>

      <rect x="108" y="86" width="44" height="44" rx="12" fill="#5B7A99"/>
      <rect x="176" y="86" width="44" height="44" rx="12" fill="#3A5A7A"/>
      <rect x="244" y="86" width="44" height="44" rx="12" fill="#6E8FAE" transform="translate(-40 0)"/>
    </g>
    <!-- 2. sor -->
    <g fill="#4E6E8E">
      <rect x="40" y="164" width="44" height="44" rx="12"/>
      <rect x="108" y="164" width="44" height="44" rx="12" fill="#37536F"/>
      <rect x="176" y="164" width="44" height="44" rx="12" fill="#5B7A99"/>
      <rect x="204" y="164" width="44" height="44" rx="12" fill="#6E8FAE"/>
    </g>
    <!-- 3. sor -->
    <g>
      <rect x="40" y="242" width="44" height="44" rx="12" fill="#37536F"/>
      <rect x="108" y="242" width="44" height="44" rx="12" fill="#6E8FAE"/>
      <rect x="176" y="242" width="44" height="44" rx="12" fill="#4E6E8E"/>
      <rect x="204" y="242" width="44" height="44" rx="12" fill="#5B7A99"/>
    </g>
    <!-- 4. sor -->
    <g>
      <rect x="40" y="320" width="44" height="44" rx="12" fill="#5B7A99"/>
      <rect x="108" y="320" width="44" height="44" rx="12" fill="#3A5A7A"/>
      <rect x="176" y="320" width="44" height="44" rx="12" fill="#6E8FAE"/>
      <rect x="204" y="320" width="44" height="44" rx="12" fill="#4E6E8E"/>
