<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 610" role="img" aria-label="Yettel app a telefon kezdőképernyőjén – helykitöltő kép">
  <!-- HELYKITÖLTŐ: cseréld le a saját képernyőfotódra (public/yettel/app-home.*) -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BBD3E4"/>
      <stop offset="1" stop-color="#8FB3CE"/>
    </linearGradient>
    <clipPath id="scr"><rect x="20" y="18" width="260" height="574" rx="34"/></clipPath>
  </defs>

  <!-- váz -->
  <rect x="8" y="6" width="284" height="598" rx="46" fill="#001D36"/>
  <rect x="14" y="12" width="272" height="586" rx="40" fill="#002340"/>
  <g clip-path="url(#scr)">
    <rect x="20" y="18" width="260" height="574" fill="url(#wall)"/>

    <!-- státuszsor -->
    <text x="40" y="52" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">9:41</text>
    <rect x="228" y="42" width="18" height="11" rx="2" fill="#FFFFFF"/>
    <rect x="250" y="41" width="22" height="13" rx="3" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="252" y="44" width="15" height="7" rx="1" fill="#FFFFFF"/>

    <!-- fülke -->
    <rect x="112" y="24" width="76" height="20" rx="10" fill="#001D36"/>

    <!-- app ikonok rácsa -->
