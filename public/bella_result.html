<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Bella babaváró — tippek</title>
<style>
  :root{
    --rose:#E48AA5; --rose-d:#C86A88; --ink:#5A3B46; --muted:#9C7C86; --gold:#E0A94B;
    --card:#FFFFFF; --line:#F1DBE2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh; min-height:100dvh; color:var(--ink);
    font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif;
    background:
      radial-gradient(120% 80% at 12% -8%, #FBE7EF 0%, transparent 55%),
      radial-gradient(120% 80% at 108% 4%, #FDEFE0 0%, transparent 52%),
      linear-gradient(180deg,#FFF7F2 0%,#FDEDF2 100%);
    display:flex; justify-content:center; padding:26px 16px 44px;
  }
  .wrap{width:100%; max-width:520px;}
  .head{text-align:center; margin-bottom:20px;}
  .head .deco{font-size:42px;}
  .kicker{display:inline-block; font-size:11px; font-weight:800; letter-spacing:.22em; text-transform:uppercase;
    color:var(--rose-d); background:#FCE7EE; border:1px solid #F6D2DE; padding:6px 13px; border-radius:999px; margin:8px 0 12px;}
  h1{font-family:Georgia,'Times New Roman',serif; font-size:32px; margin:0 0 6px; color:var(--rose-d); font-weight:700;}
  h1 .nm{color:var(--gold);}
  .sub{font-size:14px; color:var(--muted); margin:0;}
  .count{font-weight:800; color:var(--rose-d);}
  .card{background:var(--card); border:1px solid var(--line); border-radius:26px; overflow:hidden;
    box-shadow:0 26px 60px -34px rgba(120,60,80,.4);}
  .grow{display:flex; align-items:center; gap:14px; padding:15px 18px;}
  .grow + .grow{border-top:1px solid #F6E6EC;}
  .av{width:44px; height:44px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-family:Georgia,serif; font-weight:700; font-size:17px; color:#fff;
    background:linear-gradient(180deg,#EC94AF,#DE7A99);}
  .who{flex:1; min-width:0;}
  .who .nm{font-size:15.5px; font-weight:700; color:var(--ink); margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .who .sm{font-size:12px; color:var(--muted); margin:2px 0 0;}
  .guess{flex-shrink:0; text-align:right;}
  .guess .g1{font-family:Georgia,serif; font-size:15px; font-weight:700; color:var(--rose-d); white-space:nowrap;}
  .guess .g2{font-size:12px; color:var(--gold); font-weight:700; margin-top:1px;}
  .empty,.loading{background:var(--card); border:1px solid var(--line); border-radius:26px; padding:40px 24px; text-align:center; color:var(--muted); font-size:14.5px;}
  .empty .big{font-size:44px; margin-bottom:10px;}
  .foot{text-align:center; margin-top:20px; font-size:12px; color:#BBA3AB;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="deco">🎀</div>
      <div><span class="kicker">Babaváró tippjáték</span></div>
      <h1><span class="nm">Bella</span> — a tippek</h1>
      <p class="sub">Ki mikorra tippelt? <span class="count" id="count"></span></p>
    </div>
    <div id="content"><div class="loading">Tippek betöltése… 🌸</div></div>
    <div class="foot">A nyertes a nagy nap után derül ki 💕</div>
  </div>

<script>
(function(){
  var MONTHS = ["Január","Február","Március","Április","Május","Június","Július","Augusztus","Szeptember","Október","November","December"];
  var content=document.getElementById('content'), countEl=document.getElementById('count');
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function initials(name){ var p=name.trim().split(/\s+/); return ((p[0]||'')[0]||'').toUpperCase() + (p.length>1?((p[p.length-1]||'')[0]||'').toUpperCase():''); }

  fetch('/api/bella').then(function(r){ return r.json(); }).then(function(data){
    var g = (data && data.guesses) || [];
    countEl.textContent = '(' + g.length + ' tipp)';
    if(!g.length){
      content.innerHTML = '<div class="empty"><div class="big">🍼</div>Még senki sem tippelt. Legyél te az első!</div>';
      return;
    }
    var rows = g.map(function(x){
      var hh = (x.hour<10?'0':'')+x.hour;
      return '<div class="grow">'
        + '<div class="av">'+esc(initials(x.name)||'?')+'</div>'
        + '<div class="who"><p class="nm">'+esc(x.name)+'</p><p class="sm">'+esc(MONTHS[x.month-1]||'')+' '+x.day+'., '+hh+':00</p></div>'
        + '<div class="guess"><div class="g1">'+x.day+'.</div><div class="g2">'+hh+':00</div></div>'
        + '</div>';
    }).join('');
    content.innerHTML = '<div class="card">'+rows+'</div>';
  }).catch(function(){
    content.innerHTML = '<div class="empty">Nem sikerült betölteni a tippeket. 🌷</div>';
  });
})();
</script>
</body>
</html>
